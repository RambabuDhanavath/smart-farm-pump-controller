# Smart Farm Pump Controller — local infrastructure
#
# Starts:
#   - mosquitto : Eclipse Mosquitto MQTT broker (port 1883, websockets 9001)
#   - backend   : Spring Boot REST API that publishes pump commands to MQTT
#
# Usage:
#   1. Build the backend jar:  cd backend && mvn clean package
#   2. Start everything:       docker-compose up --build

version: "3.9"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: farm-mosquitto
    ports:
      - "1883:1883"    # MQTT
      - "9001:9001"    # WebSockets
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farm-pump-backend
    ports:
      - "8080:8080"    # REST API
    environment:
      - MQTT_BROKER_URL=tcp://mosquitto:1883
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto-data:
  mosquitto-log:
